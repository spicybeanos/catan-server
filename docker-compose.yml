services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catan
      POSTGRES_USER: catan
      POSTGRES_PASSWORD: catan
    ports:
      - "5432:5432"
    volumes:
      - catan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catan -d catan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  catan_pgdata:
