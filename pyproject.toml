[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catan-server"
version = "0.1.0"
description = "A FastAPI backend for the Catan game"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "fastapi[standard]",
    "uvicorn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
