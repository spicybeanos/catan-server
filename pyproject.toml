[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catan-server"
version = "0.1.0"
description = "A FastAPI backend for the Catan game"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
]

[tool.setuptools]
py-modules = ["catan", "catan_api", "db", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
